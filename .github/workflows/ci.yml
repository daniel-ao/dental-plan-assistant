name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (extraction, planning, questions, revisions, injection guard)
        run: npm test
      - name: Build static site (latest version, main link)
        run: npm run build
      - name: Build frozen versions (one folder each, see releases.txt)
        run: |
          grep -v '^#' releases.txt | while read -r folder branch tag; do
            [ -z "$folder" ] && continue
            git fetch --depth=1 origin "$branch"
            git worktree add "$RUNNER_TEMP/$folder" FETCH_HEAD
            (cd "$RUNNER_TEMP/$folder" && node scripts/build.mjs)
            cp -r "$RUNNER_TEMP/$folder/dist" "dist/$folder"
            echo "Built $branch into /$folder/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - id: deployment
        uses: actions/deploy-pages@v4

  releases:
    # Creates the GitHub release for each frozen version, once.
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -v '^#' releases.txt | while read -r folder branch tag; do
            [ -z "$folder" ] && continue
            gh release view "$tag" >/dev/null 2>&1 && continue
            sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
            gh release create "$tag" --target "$sha" --title "$tag" \
              --notes "Frozen version of the app, always available at https://daniel-ao.github.io/dental-plan-assistant/$folder/"
          done
